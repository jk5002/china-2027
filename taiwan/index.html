<title>Taiwan &amp; Beijing, October 2026</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--fg:#16202c;--muted:#5d6877;--line:#dde1e7;--accent:#c2410c;--err:#b42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--surface:#19202a;--fg:#e8ecf1;--muted:#9aa5b3;--line:#2a3340;--accent:#fb8a4e;--err:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding-inline:16px}
form{width:100%;max-width:360px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 24px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-size:1.8rem;line-height:1.05;margin:0}
label{font-size:.85rem;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
button{font:inherit;font-weight:500;padding:10px 12px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:1.2em;margin:0;font-size:.85rem;color:var(--err)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="eyebrow">10 – 23 October 2026</div>
  <h1>Taiwan &amp; Beijing</h1>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label class="row" for="rem"><input id="rem" type="checkbox"> Remember on this device</label>
  <button id="go" type="submit">Open itinerary</button>
  <p id="msg" role="alert"></p>
</form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c));
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close();}
const K="tw26-pw";
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(e){}
  if(s){try{show(await unlock(s));return}catch(e){try{localStorage.removeItem(K)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value, go=document.getElementById("go"), msg=document.getElementById("msg");
  go.disabled=true; go.textContent="Unlocking…"; msg.textContent="";
  try{const html=await unlock(pw);
    if(document.getElementById("rem").checked){try{localStorage.setItem(K,pw)}catch(_){}}
    show(html);
  }catch(err){msg.textContent="That password didn't work. Check it and try again.";go.disabled=false;go.textContent="Open itinerary";}
});
</script>
